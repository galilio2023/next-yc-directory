name: Loom AI Code Review

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @google/generative-ai

      - name: Run Gemini AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const { GoogleGenerativeAI } = require('@google/generative-ai');
          const { execSync } = require('child_process');

          async function run() {
            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
            // Using gemini-2.0-flash as requested (assuming 2.0 for the latest Flash model)
            const model = genAI.getGenerativeModel({ model: 'gemini-2.0-flash' });

            // Get the diff of the PR
            let diff;
            try {
              diff = execSync('git diff origin/main...HEAD').toString();
            } catch (e) {
              console.log('Error getting diff, trying alternative...');
              diff = execSync('git diff HEAD^ HEAD').toString();
            }

            if (!diff || diff.trim().length === 0) {
              console.log('No changes to review.');
              return;
            }

            const prompt = \`Act as a Senior Software Architect. Review the following code changes for:
            1. Architectural consistency with Next.js 15 and App Router patterns.
            2. Performance bottlenecks (unnecessary re-renders, large client components).
            3. Security vulnerabilities (exposed secrets, unsafe data handling).
            4. Adherence to the 'Loom' premium design system (Tailwind usage).
            
            Provide constructive feedback and suggest specific improvements.
            
            Code Diff:
            \${diff}\`;

            const result = await model.generateContent(prompt);
            const response = await result.response;
            const text = response.text();

            // Post the review as a comment on the PR
            const prNumber = process.env.GITHUB_EVENT_PATH ? require(process.env.GITHUB_EVENT_PATH).number : null;
            if (prNumber) {
              const body = JSON.stringify({ body: '### 🤖 Loom AI Architect Review (Gemini 2.0 Flash)\n\n' + text });
              execSync(\`curl -s -H \"Authorization: token \${process.env.GITHUB_TOKEN}\" -X POST -d '\${body}' https://api.github.com/repos/\${process.env.GITHUB_REPOSITORY}/issues/\${prNumber}/comments\`);
              console.log('Review comment posted successfully.');
            } else {
              console.log('PR number not found, review text:', text);
            }
          }
          run().catch(err => { 
            console.error('Error during AI review:', err); 
            process.exit(1); 
          });
          "
